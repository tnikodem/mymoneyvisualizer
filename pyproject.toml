[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "MyMoneyVisualizer"
dynamic = ["version"]
description = "A simple tool for the finances of a private household"
readme = "README.md"
license = "MIT"
authors = [{ name = "Thomas Nikodem" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=3.0",
    "platformdirs>=4.0",
    "pyqt6>=6.6",
    "pyqt6-multiselect-combobox>=1.2",
    "pyqtgraph>=0.13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
mmv = "mymoneyvisualizer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mymoneyvisualizer.__version__" }

[tool.setuptools.packages.find]
include = ["mymoneyvisualizer*"]

[tool.setuptools.package-data]
"mymoneyvisualizer.ui" = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-ra"

[tool.coverage.run]
source = ["mymoneyvisualizer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PTH"]
ignore = ["RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"tests/importing/conftest.py" = ["E501"]  # verbatim bank export samples
